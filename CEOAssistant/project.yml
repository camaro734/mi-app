# XcodeGen project specification.
# Genera el proyecto Xcode reproducible con:  xcodegen generate
# (instalación:  brew install xcodegen)
name: CEOAssistant
options:
  bundleIdPrefix: com.cmghidraulica.ceoassistant
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # TODO: pon aquí tu Apple Developer Team ID para firmar en dispositivo real.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # ---------------------------------------------------------------------------
  # App companion de iPhone: guarda la API key, hace las llamadas pesadas a la
  # IA, transcribe el audio recibido del Watch, gestiona calendario y correo.
  # ---------------------------------------------------------------------------
  CEOAssistant:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmghidraulica.ceoassistant
        INFOPLIST_FILE: iOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: "CEOAssistant Watch App"
        embed: true

  # ---------------------------------------------------------------------------
  # App de Apple Watch: grabar, asesor rápido, próxima cita, briefing, dictado.
  # ---------------------------------------------------------------------------
  "CEOAssistant Watch App":
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmghidraulica.ceoassistant.watchkitapp
        # Nombre de producto sin espacios (el nombre visible sale del Info.plist):
        # evita rutas con espacios en herramientas de build sensibles a ello.
        PRODUCT_NAME: CEOAssistantWatchApp
        INFOPLIST_FILE: WatchApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: "CEOAssistant Watch Widgets"
        embed: true

  # ---------------------------------------------------------------------------
  # Complicación de esfera (WidgetKit) para el Apple Watch.
  # ---------------------------------------------------------------------------
  "CEOAssistant Watch Widgets":
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
      - path: Shared
        # Un AppShortcutsProvider no es válido dentro de una app-extension y
        # rompe el paso AppIntentsSSUTraining. Los widgets no usan los intents.
        excludes:
          - "Intents/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmghidraulica.ceoassistant.watchkitapp.widgets
        PRODUCT_NAME: CEOAssistantWatchWidgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
